name: CLI release

on:
  push:
    tags: ['cli-v*']

permissions:
  contents: write

concurrency:
  group: cli-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # contents: write is only for the release step; package scripts
          # must not see a persisted token.
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26

      - name: Install
        run: bun install --frozen-lockfile

      - name: Verify approved CLI release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GIT_CONFIG_COUNT: 2
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: ''
          GIT_CONFIG_KEY_1: credential.helper
          GIT_CONFIG_VALUE_1: '!f() { if [ "$1" = get ]; then printf "%s\n" "username=x-access-token" "password=$GITHUB_TOKEN"; fi; }; f'
        run: bun run release:verify-cli-tag

      - name: Full gate
        run: |
          bun run format:check
          bun run check
          bun run test

      - name: Derive version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#cli-v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "Tag $TAG does not contain a valid semver" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build bundle
        working-directory: packages/cli
        env:
          TDRIVE_CLI_VERSION: ${{ steps.version.outputs.version }}
        run: bun run build

      - name: Smoke the bundle
        working-directory: packages/cli
        run: |
          REPORTED="$(node dist/tdrive.mjs --version)"
          echo "bundle reports: $REPORTED"
          if [ "$REPORTED" != "tdrive v${{ steps.version.outputs.version }}" ]; then
            echo "Bundle version does not match the tag" >&2
            exit 1
          fi
          # Run the full contract suite against the built artifact.
          TDRIVE_TEST_BUNDLE="$PWD/dist/tdrive.mjs" bun run test

      - name: Checksums
        working-directory: packages/cli/dist
        run: |
          cp ../../../scripts/install-cli.sh .
          sha256sum tdrive.mjs install-cli.sh > checksums.txt
          cat checksums.txt

      - name: Write release notes
        env:
          CLI_VERSION: ${{ steps.version.outputs.version }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const version = process.env.CLI_VERSION;
          const changelog = readFileSync('packages/cli/CHANGELOG.md', 'utf8');
          const section = changelog.split(`## ${version}\n`)[1]?.split(/\n## /)[0];
          if (!section?.trim()) throw new Error('Missing CLI release notes');
          const notes = [
            'Single-file build of the tdrive CLI. Requires Node >= 20.',
            section.trim(),
            'Install or update with the installer pinned to this release.',
            '```sh',
            `TDRIVE_CLI_VERSION=cli-v${version} bash -c "$(curl -fsSL https://github.com/treramey/tDrive/releases/download/cli-v${version}/install-cli.sh)"`,
            '```',
            'Already installed? Run `tdrive upgrade`. Assets are SHA-256 verified through `checksums.txt`.'
          ].join('\n\n');
          writeFileSync(`${process.env.RUNNER_TEMP}/cli-release-notes.md`, `${notes}\n`);
          JS

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: tdrive CLI ${{ steps.version.outputs.version }}
          files: |
            packages/cli/dist/tdrive.mjs
            packages/cli/dist/install-cli.sh
            packages/cli/dist/checksums.txt
          body_path: ${{ runner.temp }}/cli-release-notes.md
