name: Changesets

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: changesets-main
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0

      - name: Install
        run: bun install --frozen-lockfile

      - name: Check release credentials
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "Set RELEASE_TOKEN with Contents and Pull requests write permissions. GITHUB_TOKEN cannot trigger downstream tag workflows." >&2
            exit 1
          fi
          mkdir -m 700 -p "$RUNNER_TEMP/changesets-home"
          umask 077
          printf 'machine github.com\nlogin x-access-token\npassword %s\n' "$GITHUB_TOKEN" > "$RUNNER_TEMP/changesets-home/.netrc"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Publish app and recover approved CLI tag
        run: bun run release:prepare
        env:
          HOME: ${{ runner.temp }}/changesets-home
          APP_RELEASE_FROM: ${{ github.event.before }}

      - name: Prepare release PR or tag approved release
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d
        with:
          version: bun run release:cli-version
          publish: bun run release:cli-tag
          title: 'chore: release versions'
          commit: 'chore: release versions'
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          APP_RELEASE_FROM: ${{ github.event.before }}
          # The pinned action writes .netrc here for its git pushes and child commands.
          HOME: ${{ runner.temp }}/changesets-home

      - name: Remove release credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/changesets-home"
